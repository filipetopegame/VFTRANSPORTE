<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gerador de Overlay</title>
<style>
  :root {
    --pink: #FF3CAC;
    --purple: #784BA0;
    --yellow: #FFD93D;
    --white: #FFFFFF;
    --dark: #1a0b2e;
    --dark-light: #2d1454;
  }

  body {
    margin: 0;
    padding: 20px;
    background: #0f061b;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--white);
  }

  #setup-panel {
    max-width: 440px;
    margin: 20px auto;
    padding: 24px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--dark), var(--dark-light));
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.1);
    box-sizing: border-box;
  }

  #setup-panel h2 {
    margin: 0 0 6px;
    font-size: 20px;
    color: var(--yellow);
  }

  #setup-panel p.desc {
    margin: 0 0 18px;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    line-height: 1.4;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--yellow);
    margin: 16px 0 8px;
  }

  .overlay-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }

  .overlay-option {
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
  }

  .overlay-option.active {
    border-color: var(--yellow);
    background: linear-gradient(135deg, rgba(255,60,172,0.25), rgba(120,75,160,0.25));
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.4);
    color: var(--white);
    font-size: 13px;
  }

  .boss-extra-config {
    display: flex;
    gap: 10px;
  }

  .boss-extra-config > div {
    flex: 1;
  }

  #btn-generate {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: var(--white);
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    margin-top: 6px;
  }

  #result-box {
    display: none;
    margin-top: 20px;
    padding: 12px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    border: 1px solid var(--pink);
  }

  #result-url {
    word-break: break-all;
    font-size: 11px;
    color: var(--yellow);
    margin-bottom: 8px;
  }

  #btn-copy {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: var(--yellow);
    color: #000;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div id="setup-panel">
    <h2>Gerador de Link de Overlay</h2>
    <p class="desc">Configure as opções e gere um link dedicado para carregar como Fonte de Navegador no OBS Studio.</p>

    <div class="section-title">1. Escolha o Overlay</div>
    <div class="overlay-selector">
      <div class="overlay-option active" data-style="card" id="opt-card">
        <div class="icon">❤️</div>
        <div class="title">Contador Moderno</div>
      </div>
      <div class="overlay-option" data-style="boss" id="opt-boss">
        <div class="icon">👹</div>
        <div class="title">Boss Fight</div>
      </div>
    </div>

    <div class="section-title">2. Dados do Canal</div>
    <label for="input-channel">Link ou @usuário do canal</label>
    <input id="input-channel" type="text" placeholder="@seucanal" />

    <label for="input-key">API Key do YouTube Data API v3</label>
    <input id="input-key" type="text" placeholder="AIzaSy..." />

    <div id="boss-config-fields" style="display: none;">
      <div class="section-title">3. Configurações do Boss</div>
      <div class="boss-extra-config">
        <div>
          <label for="input-boss-goal">Meta Inicial</label>
          <input id="input-boss-goal" type="number" min="1" value="10" />
        </div>
        <div>
          <label for="input-boss-mult">Multiplicador</label>
          <input id="input-boss-mult" type="number" step="0.5" min="1" value="2" />
        </div>
      </div>
    </div>

    <button id="btn-generate">Gerar Link do OBS</button>

    <div id="result-box">
      <label>Cole este link no OBS (Fonte de Navegador):</label>
      <div id="result-url"></div>
      <button id="btn-copy">Copiar Link</button>
    </div>
  </div>

<script>
  let selectedStyle = 'card';

  const optCard = document.getElementById('opt-card');
  const optBoss = document.getElementById('opt-boss');
  const bossFields = document.getElementById('boss-config-fields');

  optCard.addEventListener('click', () => {
    selectedStyle = 'card';
    optCard.classList.add('active');
    optBoss.classList.remove('active');
    bossFields.style.display = 'none';
  });

  optBoss.addEventListener('click', () => {
    selectedStyle = 'boss';
    optBoss.classList.add('active');
    optCard.classList.remove('active');
    bossFields.style.display = 'block';
  });

  document.getElementById('btn-generate').addEventListener('click', async () => {
    const rawChannel = document.getElementById('input-channel').value.trim();
    const apiKey = document.getElementById('input-key').value.trim();
    const goal = document.getElementById('input-boss-goal').value;
    const mult = document.getElementById('input-boss-mult').value;

    if(!rawChannel || !apiKey) {
      alert('Preencha o canal e a API key');
      return;
    }

    // Resolvendo ID do Canal se necessário
    let channelId = rawChannel;
    let handleMatch = rawChannel.match(/@([A-Za-z0-9._-]+)/);
    let handle = handleMatch ? '@' + handleMatch[1] : (rawChannel.startsWith('@') ? rawChannel : null);

    if(handle) {
      try {
        const url = `https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(handle)}&key=${apiKey}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.items && data.items.length > 0) {
          channelId = data.items[0].id;
        }
      } catch(e) {
        console.error(e);
      }
    }

    // Cria a URL apontando para overlay.html no mesmo diretório
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/overlay.html';
    const params = new URLSearchParams({
      style: selectedStyle,
      channelId: channelId,
      key: apiKey,
      goal: goal,
      mult: mult
    });

    const finalUrl = `${baseUrl}?${params.toString()}`;
    
    document.getElementById('result-url').textContent = finalUrl;
    document.getElementById('result-box').style.display = 'block';
  });

  document.getElementById('btn-copy').addEventListener('click', () => {
    const url = document.getElementById('result-url').textContent;
    navigator.clipboard.writeText(url);
    alert('Link copiado com sucesso!');
  });
</script>
</body>
</html>
