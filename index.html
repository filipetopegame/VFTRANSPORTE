<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contador de Likes - Overlay</title>
<style>
  :root {
    --pink: #FF3CAC;
    --purple: #784BA0;
    --blue: #2B86C5;
    --yellow: #FFD93D;
    --white: #FFFFFF;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #card {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px 14px 18px;
    border-radius: 60px;
    background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
    background-size: 200% 200%;
    animation: flowGradient 6s ease infinite;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    width: fit-content;
  }

  @keyframes flowGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 54px;
    height: 54px;
    background: var(--white);
    border-radius: 50%;
    flex-shrink: 0;
  }

  #icon-wrap svg {
    width: 28px;
    height: 28px;
  }

  #icon-wrap.pulse {
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.35); }
    60%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  #text-block {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
  }

  #label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--yellow);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  #count {
    font-size: 40px;
    font-weight: 900;
    color: var(--white);
    text-shadow: 0 2px 6px rgba(0,0,0,0.45);
    font-variant-numeric: tabular-nums;
  }

  #count.bump {
    animation: bump 0.5s ease;
  }

  @keyframes bump {
    0%   { transform: scale(1) translateY(0); }
    40%  { transform: scale(1.15) translateY(-4px); }
    100% { transform: scale(1) translateY(0); }
  }

  #status {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    margin-top: 2px;
  }

  #stage {
    position: relative;
    width: fit-content;
  }

  #particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    top: 50%;
    left: 54px; /* sai de cima do ícone */
    font-size: 22px;
    opacity: 1;
    will-change: transform, opacity;
    animation: explode-anim linear forwards;
  }

  @keyframes explode-anim {
    0% {
      transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      opacity: 1;
    }
    70% {
      opacity: 1;
    }
    100% {
      transform:
        translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
        scale(var(--scale))
        rotate(var(--rot));
      opacity: 0;
    }
  }

  #shockwave {
    position: absolute;
    top: 50%;
    left: 54px;
    width: 54px;
    height: 54px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid var(--yellow);
    opacity: 0;
    pointer-events: none;
  }

  #shockwave.go {
    animation: shockwave-anim 0.6s ease-out;
  }

  @keyframes shockwave-anim {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  #goal-wrap {
    margin-top: 6px;
    width: 100%;
  }

  #goal-track {
    position: relative;
    width: 100%;
    height: 10px;
    background: rgba(0,0,0,0.35);
    border-radius: 6px;
    overflow: hidden;
  }

  #goal-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--yellow), #fff3b0);
    border-radius: 6px;
    transition: width 0.5s ease;
  }

  #goal-label {
    margin-top: 3px;
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
  }

  #goal-celebration {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(255,217,61,0.95), rgba(255,60,172,0.9));
    border-radius: 60px;
    opacity: 0;
    pointer-events: none;
    font-weight: 900;
    font-size: 16px;
    color: var(--purple);
    text-align: center;
    padding: 0 10px;
  }

  #goal-celebration.show {
    animation: goal-celebration-anim 2s ease forwards;
  }

  @keyframes goal-celebration-anim {
    0%   { opacity: 0; transform: scale(0.8); }
    15%  { opacity: 1; transform: scale(1.05); }
    25%  { opacity: 1; transform: scale(1); }
    85%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="card">
      <div id="icon-wrap">
        <svg viewBox="0 0 24 24" fill="#FF3CAC">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                   2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                   C13.09 3.81 14.76 3 16.5 3
                   19.58 3 22 5.42 22 8.5
                   c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div id="text-block">
        <div id="label">Likes</div>
        <div id="count">--</div>
        <div id="status">Procurando live...</div>
        <div id="goal-wrap">
          <div id="goal-track">
            <div id="goal-fill"></div>
          </div>
          <div id="goal-label">Meta: -- likes</div>
        </div>
      </div>
    </div>
    <div id="shockwave"></div>
    <div id="particles"></div>
    <div id="goal-celebration">🎉 Meta batida!</div>
  </div>

<script>
  // ======= CONFIGURAÇÃO =======
  // Troque pelos seus dados reais:
  // Cole aqui uma ou várias chaves. Se colocar mais de uma, o overlay troca
  // sozinho de chave automaticamente caso uma delas trave ou estoure a cota.
  const API_KEYS = [
    "AIzaSyD6gc0YqDR-RfhZdm5eMVgIdus3OPxL-u8",
    "AIzaSyAs0CjL5Eaqjup5f1ticbiU0qQKSbWmvmw",
    "AIzaSyBT1GHRFXdSHaK88fuEe0c4Ci0MJGqB7IY",
  ];
  const CHANNEL_URL = "https://www.youtube.com/@IShowSpeed";  // cole o link (ou @usuário) do canal aqui, sem precisar do /live

  const CHECK_LIVE_INTERVAL_MS = 60000;   // procura se está ao vivo a cada 60s (economiza cota da API)
  const UPDATE_LIKES_INTERVAL_MS = 15000; // atualiza os likes a cada 15s, só quando já está ao vivo

  const INITIAL_GOAL = 10;        // meta inicial de likes
  const GOAL_MULTIPLIER = 2;      // a meta dobra toda vez que é batida
  const MAX_GOAL = 10000000;      // teto: para de dobrar ao chegar em 10 milhões
  // =============================

  const countEl = document.getElementById('count');
  const iconWrap = document.getElementById('icon-wrap');
  const statusEl = document.getElementById('status');
  const particlesEl = document.getElementById('particles');
  const shockwaveEl = document.getElementById('shockwave');
  const goalFillEl = document.getElementById('goal-fill');
  const goalLabelEl = document.getElementById('goal-label');
  const goalCelebrationEl = document.getElementById('goal-celebration');

  let currentGoal = INITIAL_GOAL;

  let lastCount = null;
  let currentLiveVideoId = null;
  let likesTimer = null;
  let keyIndex = 0; // qual chave da lista está sendo usada agora
  let resolvedChannelId = null;
  let uploadsPlaylistId = null;

  const EMOJIS = ['❤️', '💖', '💗', '💕', '⭐'];

  function formatNumber(n) {
    return new Intl.NumberFormat('pt-BR').format(n);
  }

  function bump() {
    countEl.classList.remove('bump');
    iconWrap.classList.remove('pulse');
    void countEl.offsetWidth; // reinicia animação
    countEl.classList.add('bump');
    iconWrap.classList.add('pulse');
  }

  // Explosão de corações + onda de choque quando os likes sobem
  function explode(intensity) {
    // limita a quantidade de partículas pra não pesar (ex: se subiu 50 likes de uma vez)
    const count = Math.min(6 + intensity * 2, 24);

    shockwaveEl.classList.remove('go');
    void shockwaveEl.offsetWidth;
    shockwaveEl.classList.add('go');

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = 60 + Math.random() * 90;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 20; // puxa levemente pra cima

      p.style.setProperty('--dx', `${dx}px`);
      p.style.setProperty('--dy', `${dy}px`);
      p.style.setProperty('--scale', (0.6 + Math.random() * 0.8).toFixed(2));
      p.style.setProperty('--rot', `${(Math.random() * 360 - 180).toFixed(0)}deg`);

      const duration = 700 + Math.random() * 500;
      p.style.animationDuration = `${duration}ms`;
      p.style.fontSize = `${16 + Math.random() * 14}px`;

      particlesEl.appendChild(p);
      setTimeout(() => p.remove(), duration + 50);
    }
  }

  // Ajusta a meta pra ser sempre a próxima "parada" acima do valor atual de likes,
  // caso o overlay seja aberto já com a live rolando há um tempo (likes > meta inicial)
  function catchUpGoal(likeCount) {
    while (currentGoal < MAX_GOAL && likeCount >= currentGoal) {
      currentGoal = Math.min(currentGoal * GOAL_MULTIPLIER, MAX_GOAL);
    }
  }

  function renderGoal(likeCount) {
    const pct = Math.max(0, Math.min(100, (likeCount / currentGoal) * 100));
    goalFillEl.style.width = pct + '%';

    if (currentGoal >= MAX_GOAL && likeCount >= MAX_GOAL) {
      goalLabelEl.textContent = `Meta máxima atingida! (${formatNumber(MAX_GOAL)} likes) 🏆`;
    } else {
      goalLabelEl.textContent = `Meta: ${formatNumber(likeCount)} / ${formatNumber(currentGoal)} likes`;
    }
  }

  function celebrateGoal() {
    goalCelebrationEl.textContent = `🎉 ${formatNumber(currentGoal)} likes!`;
    goalCelebrationEl.classList.remove('show');
    void goalCelebrationEl.offsetWidth;
    goalCelebrationEl.classList.add('show');
  }

  // Verifica se a meta foi batida e, se sim, dobra ela (até o teto)
  function checkGoal(likeCount) {
    if (currentGoal < MAX_GOAL && likeCount >= currentGoal) {
      celebrateGoal();
      currentGoal = Math.min(currentGoal * GOAL_MULTIPLIER, MAX_GOAL);
    }
    renderGoal(likeCount);
  }

  function currentKey() {
    return API_KEYS[keyIndex];
  }

  function rotateKey() {
    keyIndex = (keyIndex + 1) % API_KEYS.length;
    console.warn(`Trocando pra chave #${keyIndex + 1} de ${API_KEYS.length}`);
  }

  function extractHandleOrId(raw) {
    let text = raw.trim();
    text = text.replace(/^https?:\/\/(www\.)?youtube\.com\//i, '');
    text = text.replace(/\/(live|videos|featured)\/?$/i, '');
    text = text.replace(/\/$/, '');

    const channelMatch = text.match(/channel\/([A-Za-z0-9_-]+)/);
    if (channelMatch) return { type: 'id', value: channelMatch[1] };

    if (/^UC[A-Za-z0-9_-]{20,}$/.test(text)) return { type: 'id', value: text };

    const handleMatch = text.match(/@([A-Za-z0-9._-]+)/);
    if (handleMatch) return { type: 'handle', value: '@' + handleMatch[1] };

    return { type: 'handle', value: '@' + text.replace(/^@/, '') };
  }

  // Resolve o link/handle pra um Channel ID de verdade (só precisa fazer 1 vez)
  async function resolveChannelId() {
    if (resolvedChannelId) return resolvedChannelId;

    const parsed = extractHandleOrId(CHANNEL_URL);

    if (parsed.type === 'id') {
      resolvedChannelId = parsed.value;
      return resolvedChannelId;
    }

    const url = `https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(parsed.value)}&key=${currentKey()}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.items && data.items.length > 0) {
      resolvedChannelId = data.items[0].id;
      return resolvedChannelId;
    }
    throw new Error('Canal não encontrado');
  }

  // Passo 1: procura se o canal está ao vivo agora
  // (usa playlistItems.list na playlist de uploads do canal — custa só 1 ponto de cota,
  // bem diferente do search.list que custa 100 pontos e estourava rápido)
  async function findLiveVideo() {
    try {
      const channelId = await resolveChannelId();

      if (!uploadsPlaylistId) {
        // truque: o ID da playlist de "todos os uploads" é o Channel ID trocando o prefixo UC por UU
        uploadsPlaylistId = 'UU' + channelId.slice(2);
      }

      const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&playlistId=${uploadsPlaylistId}&maxResults=3&key=${currentKey()}`;
      const playlistRes = await fetch(playlistUrl);

      if (playlistRes.status === 403 || playlistRes.status === 429) {
        if (API_KEYS.length > 1) {
          rotateKey();
          statusEl.textContent = `Trocando de chave (#${keyIndex + 1})...`;
        } else {
          statusEl.textContent = "Chave com problema (cota/permissão)";
        }
        return;
      }

      const playlistData = await playlistRes.json();
      const videoIds = (playlistData.items || []).map(it => it.contentDetails.videoId).join(',');

      if (!videoIds) {
        setNotLive();
        return;
      }

      // confirma qual desses vídeos recentes está realmente "ao vivo" agora
      const statusUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoIds}&key=${currentKey()}`;
      const statusRes = await fetch(statusUrl);
      const statusData = await statusRes.json();

      const liveItem = (statusData.items || []).find(
        it => it.snippet && it.snippet.liveBroadcastContent === 'live'
      );

      if (liveItem) {
        if (liveItem.id !== currentLiveVideoId) {
          currentLiveVideoId = liveItem.id;
          lastCount = null;
          statusEl.textContent = "Ao vivo agora";
          startLikesPolling();
        }
      } else {
        setNotLive();
      }
    } catch (err) {
      statusEl.textContent = "Erro ao checar live";
      console.error(err);
    }
  }

  function setNotLive() {
    currentLiveVideoId = null;
    countEl.textContent = "--";
    statusEl.textContent = "Aguardando live...";
    if (likesTimer) {
      clearInterval(likesTimer);
      likesTimer = null;
    }
  }

  // Passo 2: enquanto estiver ao vivo, atualiza o contador de likes
  async function fetchLikes() {
    if (!currentLiveVideoId) return;

    const statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${currentLiveVideoId}&key=${currentKey()}`;

    try {
      const res = await fetch(statsUrl);

      // se a chave atual travou (cota estourada, chave inválida, etc), tenta a próxima
      if (res.status === 403 || res.status === 429) {
        if (API_KEYS.length > 1) {
          rotateKey();
          statusEl.textContent = `Trocando de chave (#${keyIndex + 1})...`;
        } else {
          statusEl.textContent = "Chave com problema (cota/permissão)";
        }
        return;
      }

      const data = await res.json();

      if (!data.items || data.items.length === 0) return;

      const likeCount = parseInt(data.items[0].statistics.likeCount, 10);

      if (lastCount !== null && likeCount !== lastCount) {
        bump();
        if (likeCount > lastCount) {
          explode(likeCount - lastCount);
        }
      }

      // ao abrir o overlay com uma live já em andamento, pula a meta pra frente
      // até achar a próxima "parada" acima do valor atual, sem disparar celebrações antigas
      if (lastCount === null) {
        catchUpGoal(likeCount);
        renderGoal(likeCount);
      } else {
        checkGoal(likeCount);
      }

      countEl.textContent = formatNumber(likeCount);
      lastCount = likeCount;
      if (statusEl.textContent.startsWith('Trocando') || statusEl.textContent.startsWith('Chave')) {
        statusEl.textContent = "Ao vivo agora";
      }
    } catch (err) {
      console.error(err);
    }
  }

  function startLikesPolling() {
    if (likesTimer) clearInterval(likesTimer);
    fetchLikes();
    likesTimer = setInterval(fetchLikes, UPDATE_LIKES_INTERVAL_MS);
  }

  function start() {
    if (!API_KEYS.length || API_KEYS[0] === "SUA_API_KEY_AQUI" || !CHANNEL_URL) {
      countEl.textContent = "Config?";
      statusEl.textContent = "Edite API_KEYS e CHANNEL_URL no arquivo";
      return;
    }
    findLiveVideo();
    setInterval(findLiveVideo, CHECK_LIVE_INTERVAL_MS);
  }

  start();
</script>

</body>
</html>
